<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 870 350" width="870" height="350" role="img"
     aria-label="Graphical models of the original MDP under a softmax policy and of the augmented MDP with Gumbel shocks">
<style>
  .title { font: 600 11.5px 'IBM Plex Sans', system-ui, -apple-system, 'Segoe UI', sans-serif;
           letter-spacing: .07em; text-transform: uppercase; fill: #5c6874; }
  .node { fill: #ffffff; stroke: #1b2430; stroke-width: 1.6; }
  .node.inner { fill: none; stroke-width: 1.2; }
  .node.eps { fill: #ffffff; stroke: #2f6f8f; stroke-dasharray: 4 3; }
  .nlab { font: italic 18px Newsreader, Georgia, 'Times New Roman', serif; fill: #1b2430; }
  .nlab.eps { fill: #2f6f8f; }
  .up { font-style: normal; }
  .lab { font: italic 14px Newsreader, Georgia, 'Times New Roman', serif; fill: #5c6874; }
  .eq { font: italic 14.5px Newsreader, Georgia, 'Times New Roman', serif; fill: #1b2430; }
  .note { font: 12px 'IBM Plex Sans', system-ui, -apple-system, sans-serif; fill: #6e7982; }
  .box { fill: none; stroke: #9ca7ae; stroke-width: 1.1; stroke-dasharray: 2 3; }
  .e { fill: none; stroke-width: 1.6; }
  .k { stroke: #1b2430; } .kh { fill: #1b2430; }
  .b { stroke: #2f6f8f; } .bh { fill: #2f6f8f; }
  .dots { font: 20px Georgia, serif; fill: #6e7982; }
  @media (prefers-color-scheme: dark) {
    .title { fill: #a8b2b9; }
    .node { fill: #1b2430; stroke: #edf1f1; }
    .node.inner { fill: none; }
    .node.eps { fill: #1b2430; stroke: #72a8c2; }
    .nlab { fill: #edf1f1; }
    .nlab.eps { fill: #72a8c2; }
    .lab { fill: #a8b2b9; }
    .eq { fill: #edf1f1; }
    .note { fill: #9ca7ae; }
    .box { stroke: #6e7982; }
    .k { stroke: #edf1f1; } .kh { fill: #edf1f1; }
    .b { stroke: #72a8c2; } .bh { fill: #72a8c2; }
    .dots { fill: #9ca7ae; }
  }
</style>
<defs><marker id="h-k" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="kh" d="M0,0.8 L10,5 L0,9.2 z"/></marker><marker id="h-b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="bh" d="M0,0.8 L10,5 L0,9.2 z"/></marker></defs>
<g>
  <text class="title" x="6" y="22">(a) original MDP, softmax policy</text>
  <path class="e k" d="M62.0,252.0 L176.5,252.0" marker-end="url(#h-k)"/>
  <path class="e k" d="M55.6,236.4 L103.4,188.6" marker-end="url(#h-k)"/>
  <path class="e k" d="M135.6,187.6 L183.4,235.4" marker-end="url(#h-k)"/>
  <path class="e k" d="M222.0,252.0 L336.5,252.0" marker-end="url(#h-k)"/>
  <path class="e k" d="M215.6,236.4 L263.4,188.6" marker-end="url(#h-k)"/>
  <path class="e k" d="M295.6,187.6 L343.4,235.4" marker-end="url(#h-k)"/>
  <text class="lab" x="68.0" y="206.0" text-anchor="end"><tspan dy="0">π</tspan><tspan class="up" font-size="11" dy="4">β</tspan></text>
  <text class="lab" x="172.0" y="206.0">p</text>
  <circle class="node" cx="40.0" cy="252.0" r="22"/><text class="nlab" x="37.0" y="257.0" text-anchor="middle"><tspan dy="0">s</tspan><tspan class="up" font-size="11" dy="4">t</tspan></text>
  <circle class="node" cx="200.0" cy="252.0" r="22"/><text class="nlab" x="197.0" y="257.0" text-anchor="middle"><tspan dy="0">s</tspan><tspan class="up" font-size="11" dy="4">t+1</tspan></text>
  <circle class="node" cx="360.0" cy="252.0" r="22"/><text class="nlab" x="357.0" y="257.0" text-anchor="middle"><tspan dy="0">s</tspan><tspan class="up" font-size="11" dy="4">t+2</tspan></text>
  <circle class="node" cx="120.0" cy="172.0" r="22"/><text class="nlab" x="117.0" y="177.0" text-anchor="middle"><tspan dy="0">a</tspan><tspan class="up" font-size="11" dy="4">t</tspan></text>
  <circle class="node" cx="280.0" cy="172.0" r="22"/><text class="nlab" x="277.0" y="177.0" text-anchor="middle"><tspan dy="0">a</tspan><tspan class="up" font-size="11" dy="4">t+1</tspan></text>
  <text class="dots" x="400.0" y="258.0">⋯</text>
  <text class="eq" x="6" y="306"><tspan dy="0"></tspan><tspan class="up">action</tspan><tspan>  a</tspan><tspan class="up" font-size="11" dy="4">t</tspan><tspan dy="-4"> ~ π</tspan><tspan class="up" font-size="11" dy="4">β</tspan><tspan dy="-4">(· | s</tspan><tspan class="up" font-size="11" dy="4">t</tspan><tspan dy="-4">) ∝ </tspan><tspan class="up">exp</tspan><tspan>(β q(s</tspan><tspan class="up" font-size="11" dy="4">t</tspan><tspan dy="-4">, ·))</tspan></text>
  <text class="eq" x="6" y="330"><tspan dy="0"></tspan><tspan class="up">reward</tspan><tspan>  r(s</tspan><tspan class="up" font-size="11" dy="4">t</tspan><tspan dy="-4">, a</tspan><tspan class="up" font-size="11" dy="4">t</tspan><tspan dy="-4">) + β</tspan><tspan class="up" font-size="11" dy="-6">−1</tspan><tspan dy="6"> H(π</tspan><tspan class="up" font-size="11" dy="4">β</tspan><tspan dy="-4">(· | s</tspan><tspan class="up" font-size="11" dy="4">t</tspan><tspan dy="-4">))</tspan></text>
</g>
<g>
  <text class="title" x="436" y="22">(b) augmented MDP, Gumbel shocks</text>
  <rect class="box" x="439.0" y="59.0" width="62" height="226.0" rx="14"/>
  <rect class="box" x="599.0" y="59.0" width="62" height="226.0" rx="14"/>
  <rect class="box" x="759.0" y="59.0" width="62" height="226.0" rx="14"/>
  <path class="e k" d="M492.0,252.0 L606.5,252.0" marker-end="url(#h-k)"/>
  <path class="e k" d="M485.6,236.4 L533.4,188.6" marker-end="url(#h-k)"/>
  <path class="e k" d="M565.6,187.6 L613.4,235.4" marker-end="url(#h-k)"/>
  <path class="e b" d="M485.6,107.6 L533.4,155.4" marker-end="url(#h-b)"/>
  <path class="e k" d="M652.0,252.0 L766.5,252.0" marker-end="url(#h-k)"/>
  <path class="e k" d="M645.6,236.4 L693.4,188.6" marker-end="url(#h-k)"/>
  <path class="e k" d="M725.6,187.6 L773.4,235.4" marker-end="url(#h-k)"/>
  <path class="e b" d="M645.6,107.6 L693.4,155.4" marker-end="url(#h-b)"/>
  <circle class="node" cx="470.0" cy="252.0" r="22"/><text class="nlab" x="467.0" y="257.0" text-anchor="middle"><tspan dy="0">s</tspan><tspan class="up" font-size="11" dy="4">t</tspan></text>
  <circle class="node eps" cx="470.0" cy="92.0" r="22"/><text class="nlab eps" x="467.0" y="97.0" text-anchor="middle"><tspan dy="0">ε</tspan><tspan class="up" font-size="11" dy="4">t</tspan></text>
  <circle class="node" cx="630.0" cy="252.0" r="22"/><text class="nlab" x="627.0" y="257.0" text-anchor="middle"><tspan dy="0">s</tspan><tspan class="up" font-size="11" dy="4">t+1</tspan></text>
  <circle class="node eps" cx="630.0" cy="92.0" r="22"/><text class="nlab eps" x="627.0" y="97.0" text-anchor="middle"><tspan dy="0">ε</tspan><tspan class="up" font-size="11" dy="4">t+1</tspan></text>
  <circle class="node" cx="790.0" cy="252.0" r="22"/><text class="nlab" x="787.0" y="257.0" text-anchor="middle"><tspan dy="0">s</tspan><tspan class="up" font-size="11" dy="4">t+2</tspan></text>
  <circle class="node eps" cx="790.0" cy="92.0" r="22"/><text class="nlab eps" x="787.0" y="97.0" text-anchor="middle"><tspan dy="0">ε</tspan><tspan class="up" font-size="11" dy="4">t+2</tspan></text>
  <circle class="node" cx="550.0" cy="172.0" r="22"/><circle class="node inner" cx="550.0" cy="172.0" r="18"/><text class="nlab" x="547.0" y="177.0" text-anchor="middle"><tspan dy="0">a</tspan><tspan class="up" font-size="11" dy="4">t</tspan></text>
  <circle class="node" cx="710.0" cy="172.0" r="22"/><circle class="node inner" cx="710.0" cy="172.0" r="18"/><text class="nlab" x="707.0" y="177.0" text-anchor="middle"><tspan dy="0">a</tspan><tspan class="up" font-size="11" dy="4">t+1</tspan></text>
  <text class="dots" x="830.0" y="258.0">⋯</text>
  <text class="eq" x="436" y="306"><tspan dy="0"></tspan><tspan class="up">action</tspan><tspan>  a</tspan><tspan class="up" font-size="11" dy="4">t</tspan><tspan dy="-4"> = </tspan><tspan class="up">argmax</tspan><tspan></tspan><tspan class="up" font-size="11" dy="4">a</tspan><tspan dy="-4"> { q(s</tspan><tspan class="up" font-size="11" dy="4">t</tspan><tspan dy="-4">, a) + ε</tspan><tspan class="up" font-size="11" dy="4">t</tspan><tspan dy="-4">(a) }</tspan></text>
  <text class="eq" x="436" y="330"><tspan dy="0"></tspan><tspan class="up">reward</tspan><tspan>  r(s</tspan><tspan class="up" font-size="11" dy="4">t</tspan><tspan dy="-4">, a</tspan><tspan class="up" font-size="11" dy="4">t</tspan><tspan dy="-4">) + ε</tspan><tspan class="up" font-size="11" dy="4">t</tspan><tspan dy="-4">(a</tspan><tspan class="up" font-size="11" dy="4">t</tspan><tspan dy="-4">)</tspan></text>
</g>
</svg>
