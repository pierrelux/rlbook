<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 510" role="img" aria-labelledby="title description">
  <title id="title">One quadratic in monomial and nodal coordinates</title>
  <desc id="description">The polynomial p of tau equals one plus two tau minus tau squared is represented first by its monomial coefficients a and then by its values y at support nodes zero, one half, and one. Fixed differentiation and quadrature operators act on y.</desc>
  <defs>
    <marker id="arrow-ink" markerWidth="8" markerHeight="8" refX="6.6" refY="4" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,4 L0,8 Z" fill="#5B6470"/>
    </marker>
    <marker id="arrow-blue" markerWidth="8" markerHeight="8" refX="6.6" refY="4" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,4 L0,8 Z" fill="#0072B2"/>
    </marker>
    <style>
      .sans { font-family: "IBM Plex Sans", "Avenir Next", Arial, sans-serif; }
      .math { font-family: "STIX Two Text", "STIX Two Math", Georgia, serif; }
      .ink { fill: #20242A; }
      .muted { fill: #5B6470; }
      .blue { fill: #0072B2; }
      .eyebrow { font-size: 13px; font-weight: 700; letter-spacing: 1.6px; }
      .heading { font-size: 20px; font-weight: 650; }
      .formula { font-size: 23px; }
      .small { font-size: 15px; }
      .note { font-size: 16px; }
      .card { fill: #FFFFFF; stroke: #CAD1D8; stroke-width: 1.4; }
      .card-blue { fill: #F2F8FC; stroke: #0072B2; stroke-width: 1.8; }
      .operation { fill: #F7F8F9; stroke: #CAD1D8; stroke-width: 1.3; }
      .rule { fill: none; stroke: #CAD1D8; stroke-width: 1.2; }
      .guide { fill: none; stroke: #CAD1D8; stroke-width: 1.2; stroke-dasharray: 3 5; }
      .arrow { fill: none; stroke: #5B6470; stroke-width: 1.55; stroke-linecap: round; marker-end: url(#arrow-ink); }
      .arrow-blue { fill: none; stroke: #0072B2; stroke-width: 1.8; stroke-linecap: round; marker-end: url(#arrow-blue); }
      .curve { fill: none; stroke: #20242A; stroke-width: 3; stroke-linecap: round; }
      .node { fill: #0072B2; stroke: #FFFFFF; stroke-width: 2.5; }
    </style>
  </defs>

  <rect width="1100" height="510" fill="#FFFFFF"/>

  <!-- The two coordinate vectors are the primary comparison. -->
  <rect class="card" x="52" y="74" width="252" height="210" rx="10"/>
  <text class="sans eyebrow muted" x="78" y="108">MONOMIAL COORDINATES</text>
  <text class="sans heading ink" x="78" y="144">coefficient vector</text>
  <text class="math formula ink" x="78" y="190"><tspan font-style="italic">p</tspan>(τ) = 1 + 2τ − τ²</text>
  <line class="rule" x1="78" y1="211" x2="278" y2="211"/>
  <text class="math formula ink" x="78" y="247"><tspan font-style="italic">a</tspan> = (1, 2, −1)<tspan baseline-shift="super" font-size="14">T</tspan></text>
  <text class="sans small muted" x="78" y="269">coefficients of 1, τ, τ²</text>

  <!-- A concrete curve prevents the coordinate change from looking abstract. -->
  <text class="sans eyebrow muted" x="408" y="108">THE SAME QUADRATIC</text>
  <text class="math note ink" x="408" y="137"><tspan font-style="italic">p</tspan>(σ<tspan baseline-shift="sub" font-size="11">i</tspan>) = <tspan font-style="italic">y</tspan><tspan baseline-shift="sub" font-size="11">i</tspan></text>
  <line class="rule" x1="408" y1="241" x2="678" y2="241"/>
  <line class="guide" x1="422" y1="153" x2="422" y2="241"/>
  <line class="guide" x1="543" y1="153" x2="543" y2="241"/>
  <line class="guide" x1="664" y1="153" x2="664" y2="241"/>
  <path class="curve" d="M422 223 C458 197, 505 174, 543 157 C586 141, 627 134, 664 132"/>
  <circle class="node" cx="422" cy="223" r="6.5"/>
  <circle class="node" cx="543" cy="157" r="6.5"/>
  <circle class="node" cx="664" cy="132" r="6.5"/>
  <text class="sans small blue" x="422" y="210" text-anchor="middle">1</text>
  <text class="sans small blue" x="543" y="145" text-anchor="middle">7/4</text>
  <text class="sans small blue" x="664" y="120" text-anchor="middle">2</text>
  <text class="math small muted" x="422" y="266" text-anchor="middle">0</text>
  <text class="math small muted" x="543" y="266" text-anchor="middle">1/2</text>
  <text class="math small muted" x="664" y="266" text-anchor="middle">1</text>
  <text class="sans small muted" x="543" y="292" text-anchor="middle">support nodes σ<tspan baseline-shift="sub" font-size="11">i</tspan></text>

  <rect class="card-blue" x="762" y="74" width="286" height="210" rx="10"/>
  <text class="sans eyebrow blue" x="789" y="108">NODAL COORDINATES</text>
  <text class="sans heading ink" x="789" y="144">values at support nodes</text>
  <text class="math formula ink" x="789" y="190">σ = (0, 1/2, 1)</text>
  <line class="rule" x1="789" y1="211" x2="1022" y2="211"/>
  <text class="math formula blue" x="789" y="247"><tspan font-style="italic">y</tspan> = (1, 7/4, 2)<tspan baseline-shift="super" font-size="14">T</tspan></text>
  <text class="sans small blue" x="789" y="269">variables stored by the NLP</text>

  <path class="arrow" d="M316 180 H386"/>
  <path class="arrow-blue" d="M694 180 H744"/>
  <text class="math small blue" x="719" y="164" text-anchor="middle"><tspan font-style="italic">y</tspan> = V<tspan font-style="italic">a</tspan></text>
  <text class="sans small muted" x="719" y="199" text-anchor="middle">evaluate at σ</text>

  <!-- The stored nodal vector fans out to the two fixed maps. -->
  <path class="arrow-blue" d="M905 297 V337 H540 V359"/>
  <path class="arrow-blue" d="M905 337 V359"/>
  <text class="sans note muted" x="905" y="323" text-anchor="middle">fixed after choosing σ</text>

  <rect class="operation" x="364" y="372" width="350" height="96" rx="9"/>
  <text class="sans eyebrow muted" x="390" y="402">NODAL DERIVATIVES</text>
  <text class="math formula ink" x="390" y="440">D<tspan font-style="italic">y</tspan> = (2, 1, 0)<tspan baseline-shift="super" font-size="14">T</tspan></text>
  <text class="math small muted" x="650" y="440" text-anchor="end"><tspan font-style="italic">p</tspan>′(σ<tspan baseline-shift="sub" font-size="11">i</tspan>)</text>

  <rect class="operation" x="752" y="372" width="296" height="96" rx="9"/>
  <text class="sans eyebrow muted" x="778" y="402">EXACT INTEGRAL</text>
  <text class="math formula ink" x="778" y="440"><tspan font-style="italic">w</tspan><tspan baseline-shift="super" font-size="14">T</tspan><tspan font-style="italic">y</tspan> = 5/3</text>
  <text class="math small muted" x="1020" y="440" text-anchor="end">∫₀¹ <tspan font-style="italic">p</tspan>(τ) dτ</text>
</svg>
