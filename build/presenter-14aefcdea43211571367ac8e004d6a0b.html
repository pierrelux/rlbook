<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>RL &amp; Control — Recorded Spotlight Presenter</title>
  <style>
    :root { color-scheme: light dark; --accent:#356ae6; --surface:rgba(255,255,255,.96); --surface-solid:#fff; --border:rgba(15,23,42,.14); --text:#172033; --muted:#657087; --shadow:0 18px 55px rgba(15,23,42,.2); }
    * { box-sizing:border-box; }
    html,body { width:100%;height:100%;margin:0;overflow:hidden;background:#fff;color:var(--text);font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif; }
    #notes { display:block;width:100%;height:100%;border:0;background:#fff; }
    .controls { position:fixed;left:50%;bottom:1rem;z-index:20;display:flex;align-items:center;gap:.25rem;max-width:calc(100vw - 1rem);padding:.35rem;border:1px solid var(--border);border-radius:999px;background:var(--surface);box-shadow:var(--shadow);backdrop-filter:blur(18px);transform:translateX(-50%); }
    button { min-width:2.45rem;min-height:2.45rem;padding:.55rem .75rem;border:0;border-radius:999px;color:inherit;background:transparent;font:650 .8rem/1 system-ui,sans-serif;white-space:nowrap;cursor:pointer; }
    button:hover { background:color-mix(in srgb,var(--accent) 12%,transparent); }
    button:focus-visible { outline:3px solid color-mix(in srgb,var(--accent) 42%,transparent);outline-offset:2px; }
    button:disabled { opacity:.38;cursor:not-allowed; }
    [hidden] { display:none !important; }
    .progress { min-width:6.2rem;padding:0 .55rem;color:var(--muted);font-size:.76rem;font-weight:650;text-align:center;white-space:nowrap; }
    .hint,.loading { position:fixed;top:1rem;left:50%;z-index:20;max-width:calc(100vw - 2rem);padding:.55rem .85rem;border:1px solid var(--border);border-radius:999px;color:var(--muted);background:var(--surface);box-shadow:0 7px 24px rgba(15,23,42,.12);font-size:.76rem;font-weight:550;text-align:center;pointer-events:none;transform:translateX(-50%);transition:opacity 180ms ease,translate 180ms ease; }
    .hint { opacity:0;translate:0 -.5rem; }
    .hint.visible { opacity:1;translate:0 0; }
    .loading.hidden { opacity:0; }
    dialog { width:min(42rem,calc(100vw - 2rem));max-height:min(80vh,52rem);padding:0;overflow:hidden;border:1px solid var(--border);border-radius:1.1rem;color:var(--text);background:var(--surface-solid);box-shadow:var(--shadow); }
    dialog::backdrop { background:rgba(15,23,42,.64);backdrop-filter:blur(5px); }
    .dialog-body { padding:1.25rem; }
    .dialog-body h2 { margin:0 0 .35rem;font-size:1.15rem; }
    .dialog-body>p { margin:0;color:var(--muted);font-size:.88rem;line-height:1.45; }
    .dialog-actions { display:flex;justify-content:flex-end;gap:.35rem;padding:1rem 1.25rem;border-top:1px solid var(--border); }
    .dialog-actions .primary { color:white;background:var(--accent); }
    .dialog-actions .danger { color:#b42318; }
    .cue-list { display:grid;gap:.5rem;max-height:min(55vh,34rem);margin-top:1rem;padding:0;overflow:auto;list-style:none; }
    .cue-item { display:grid;grid-template-columns:auto minmax(0,1fr) auto;align-items:center;gap:.7rem;padding:.65rem;border:1px solid var(--border);border-radius:.75rem;background:color-mix(in srgb,var(--surface-solid) 94%,var(--accent) 6%); }
    .cue-item.dragging { opacity:.45; }
    .cue-number { color:var(--muted);font:650 .74rem/1 ui-monospace,monospace; }
    .cue-copy { min-width:0;text-align:left; }
    .cue-title { display:block;overflow:hidden;font-size:.86rem;text-overflow:ellipsis;white-space:nowrap; }
    .cue-preview { display:block;margin-top:.2rem;overflow:hidden;color:var(--muted);font-size:.72rem;font-weight:400;text-overflow:ellipsis;white-space:nowrap; }
    .cue-buttons { display:flex;gap:.1rem; }
    .cue-buttons button { min-width:1.9rem;min-height:1.9rem;padding:.35rem;font-size:.72rem; }
    .empty-cues { padding:2rem 1rem;color:var(--muted);text-align:center; }
    @media(prefers-color-scheme:dark){:root{--accent:#82a7ff;--surface:rgba(28,25,23,.96);--surface-solid:#1c1917;--border:rgba(255,255,255,.16);--text:#f5f5f4;--muted:#b6b1aa;--shadow:0 18px 55px rgba(0,0,0,.55)}html,body,#notes{background:#1c1917}.dialog-actions .danger{color:#fda29b}}
    @media(max-width:760px){.controls{bottom:.5rem;flex-wrap:wrap;justify-content:center;border-radius:1rem}.controls button{min-width:2.15rem;padding-inline:.52rem}.progress{min-width:4.8rem}.cue-item{grid-template-columns:auto minmax(0,1fr)}.cue-buttons{grid-column:2}}
  </style>
</head>
<body>
  <iframe id="notes" title="Course notes in recorded spotlight mode"></iframe>
  <div class="loading" role="status">Preparing spotlight…</div>
  <div class="hint" role="status"></div>
  <div class="controls" role="toolbar" aria-label="Presentation controls">
    <button type="button" data-action="previous" title="Previous cue (←)" aria-label="Previous cue" hidden>←</button>
    <span class="progress" aria-live="polite">Preparing…</span>
    <button type="button" data-action="next" title="Next cue (→ or Space)" aria-label="Next cue" hidden>→</button>
    <button type="button" data-action="select" title="Return to selection mode (Esc)" hidden>Select next</button>
    <button type="button" data-action="new" title="Record a new presentation" hidden>New recording</button>
    <button type="button" data-action="undo" title="Remove the last recorded cue" hidden>Undo</button>
    <button type="button" data-action="review" title="Review, reorder, and freeze cues" hidden>Review / Freeze</button>
    <button type="button" data-action="stage" title="Enlarge the focused cue (Enter)" aria-label="Enlarge focused cue" hidden>Enlarge</button>
    <button type="button" data-action="exit" title="Return to the notes" aria-label="Return to the notes">Exit</button>
  </div>
  <dialog id="resume-dialog" aria-labelledby="resume-title">
    <div class="dialog-body"><h2 id="resume-title">Resume unfinished recording?</h2><p id="resume-copy">A draft presentation was saved in this browser.</p></div>
    <div class="dialog-actions"><button type="button" data-resume="discard" class="danger">Discard</button><button type="button" data-resume="resume" class="primary">Resume</button></div>
  </dialog>
  <dialog id="review-dialog" aria-labelledby="review-title">
    <div class="dialog-body"><h2 id="review-title">Review recorded cues</h2><p>Drag to reorder, preview any cue, or remove mistakes before downloading.</p><ol class="cue-list"></ol></div>
    <div class="dialog-actions"><button type="button" data-review="close">Close</button><button type="button" data-review="freeze" class="primary">Freeze &amp; Download</button></div>
  </dialog>
  <!-- RL_RECORDED_DECKS_START -->
  <script id="rl-recorded-decks" type="application/json">{}</script>
  <!-- RL_RECORDED_DECKS_END -->
  <script>
    (() => {
      const frame=document.querySelector('#notes');
      const progress=document.querySelector('.progress');
      const hint=document.querySelector('.hint');
      const loading=document.querySelector('.loading');
      const controls=document.querySelector('.controls');
      const resumeDialog=document.querySelector('#resume-dialog');
      const reviewDialog=document.querySelector('#review-dialog');
      const cueList=document.querySelector('.cue-list');
      const deckRegistry=JSON.parse(document.querySelector('#rl-recorded-decks').textContent||'{}');
      const action=(name)=>document.querySelector(`[data-action="${name}"]`);
      const normalize=(value)=>String(value||'').replace(/\s+/g,' ').replace(/¶/g,'').trim();
      const clamp=(value,minimum,maximum)=>Math.max(minimum,Math.min(maximum,value));
      const state={mode:'recording',phase:'selecting',candidates:[],cues:[],replayCues:[],activeIndex:-1,selected:[],staged:false,drag:null,selectionBox:null,stageShell:null,sourceSha:'',slug:'',draftKey:'',sessionStartedAt:'',hintTimer:0,draggedCue:-1};

      const frameStyles=`
        :root{--rl-accent:#356ae6;--rl-surface:rgba(255,255,255,.98);--rl-border:rgba(15,23,42,.14);--rl-shadow:0 18px 60px rgba(15,23,42,.2)}
        .dark{--rl-accent:#82a7ff;--rl-surface:rgba(28,25,23,.98);--rl-border:rgba(255,255,255,.16);--rl-shadow:0 18px 60px rgba(0,0,0,.55)}
        html{scroll-behavior:smooth}body{overscroll-behavior-y:contain}
        .myst-top-nav,.myst-primary-sidebar-topnav,.myst-primary-sidebar-toc,.myst-outline,article>.block.my-10.lg\\:sticky,article>.myst-fm-block .myst-fm-authors-affiliations,article>.myst-fm-block a[href*="github.com"],article>.myst-fm-block button{display:none!important}
        body>main.article-grid,article.article-grid{display:block!important;width:100%!important;max-width:none!important}
        article.content{width:min(88vw,1120px)!important;max-width:none!important;margin:0 auto!important;padding:7vh 0 18vh!important;font-size:clamp(1.08rem,1.45vw,1.55rem)!important;line-height:1.58!important}
        article>.myst-fm-block{margin-bottom:8vh!important;padding-top:0!important}article>.myst-fm-block h1{font-size:clamp(2.5rem,5vw,5.4rem)!important;line-height:1.03!important;letter-spacing:-.035em!important}
        body.rl-selecting article.content{cursor:crosshair!important;user-select:none!important}.rl-candidate{position:relative;border-radius:.7rem;transform-origin:center left;transition:opacity 180ms ease,filter 180ms ease,transform 180ms ease}
        body.rl-focused .rl-candidate{opacity:.12;filter:blur(1px);transform:scale(.994)}body.rl-focused .rl-candidate.rl-selected{z-index:2;opacity:1;filter:none;transform:scale(1.012)}
        body.rl-focused .rl-candidate.rl-first-selected::before{position:absolute;top:.08em;bottom:.08em;left:-1.2rem;width:4px;border-radius:999px;background:var(--rl-accent);content:""}
        .rl-selection-box{position:fixed;z-index:70;display:none;border:2px solid var(--rl-accent);border-radius:.35rem;background:color-mix(in srgb,var(--rl-accent) 12%,transparent);box-shadow:0 0 0 1px rgba(255,255,255,.7) inset;pointer-events:none}
        .rl-stage-shell{position:fixed;inset:0;z-index:85;display:none;align-items:center;justify-content:center;padding:5vh 5vw 8vh;background:rgba(15,23,42,.78);backdrop-filter:blur(5px)}.rl-stage-shell.visible{display:flex}
        .rl-stage-panel{display:flex;flex-direction:column;justify-content:center;width:min(90vw,1320px);max-height:87vh;padding:clamp(1.4rem,4vw,4rem);overflow:auto;border:1px solid var(--rl-border);border-radius:1.25rem;color:inherit;background:var(--rl-surface);box-shadow:var(--rl-shadow)}
        .rl-stage-panel>*{opacity:1!important;filter:none!important;transform:none!important}.rl-stage-panel img,.rl-stage-panel svg,.rl-stage-panel canvas{max-height:68vh!important;object-fit:contain}
        @media(prefers-reduced-motion:reduce){html{scroll-behavior:auto}.rl-candidate{transition:none}}
      `;

      const sourceUrl=()=>{const requested=new URLSearchParams(location.search).get('page');const fallback=new URL('../dynamics',location.href);try{const candidate=new URL(requested||document.referrer||fallback,location.href);if(candidate.origin!==location.origin||candidate.pathname===location.pathname)return fallback.href;return candidate.href}catch{return fallback.href}};
      const doc=()=>frame.contentDocument;
      const win=()=>frame.contentWindow;
      const showHint=(message,duration=2800)=>{hint.textContent=message;hint.classList.add('visible');clearTimeout(state.hintTimer);state.hintTimer=setTimeout(()=>hint.classList.remove('visible'),duration)};
      const pageSlug=()=>{const parts=win().location.pathname.split('/').filter(Boolean);return decodeURIComponent(parts.at(-1)||'index')};
      const hashText=(value)=>{const bytes=new TextEncoder().encode(normalize(value));let hash=0x811c9dc5;bytes.forEach((byte)=>{hash^=byte;hash=Math.imul(hash,0x01000193)});return(hash>>>0).toString(16).padStart(8,'0')};
      const visible=(element)=>{const style=win().getComputedStyle(element);const rect=element.getBoundingClientRect();return style.display!=='none'&&style.visibility!=='hidden'&&rect.width>0&&rect.height>0};
      const validTopBlock=(element)=>{if(!(element instanceof win().HTMLElement))return false;if(element.matches('script,style,link,.hidden,#skip-to-article'))return false;if(element.classList.contains('myst-fm-block')||element.classList.contains('myst-footer-links'))return false;if(element.matches('.block.my-10.lg\\:sticky,.myst-backmatter-parts'))return false;return Boolean(normalize(element.innerText)||element.querySelector('img,svg,canvas,iframe,pre,table,math'))};
      const semanticType=(element)=>{if(element.matches('h1,h2,h3,h4'))return'heading';if(element.matches('p'))return'paragraph';if(element.matches('li'))return'list_item';if(element.matches('figure'))return'figure';if(element.matches('table'))return'table';if(element.matches('pre'))return'code';if(element.matches('.flex.my-5.group,[id][class*="math"]'))return'equation';if(element.matches('summary'))return'details_summary';if(element.matches('aside'))return'admonition';if(element.matches('details'))return'details';if(element.matches('.myst-jp-nb-block'))return'notebook_output';return'block'};
      const atomicDescendants=(container)=>[...container.querySelectorAll('summary,h1,h2,h3,h4,p,li,figure,table,pre,.flex.my-5.group')].filter((element)=>{if(!visible(element)||element.closest('.hidden'))return false;if(element.matches('p')&&element.closest('li'))return false;if(element.closest('aside,details,ul,ol')&&element.closest('aside,details,ul,ol')!==container)return false;return true});
      const semanticChildren=(block)=>{if(block.matches('aside,details,ul,ol'))return atomicDescendants(block);const rich=[...block.querySelectorAll('figure,table,pre,.flex.my-5.group')].filter((element)=>visible(element)&&!element.closest('.hidden')&&element.closest('.myst-jp-nb-block,article.content')===block);return rich};
      const buildCandidates=(article)=>{const title=article.querySelector(':scope>.myst-fm-block h1');const topBlocks=[...article.children].filter(validTopBlock);const candidates=[];if(title)candidates.push(title);topBlocks.forEach((block)=>{const atoms=semanticChildren(block);candidates.push(...(atoms.length?atoms:[block]))});return candidates.filter((candidate,index,all)=>all.indexOf(candidate)===index&&visible(candidate)&&!all.some((other,otherIndex)=>otherIndex!==index&&other.contains(candidate)))};
      const headingIdFor=(element)=>{const article=element.closest('article.content');const top=[...article.children].find((child)=>child===element||child.contains(element));if(!top)return'';let sibling=top.previousElementSibling;while(sibling){if(sibling.matches('h2[id],h3[id],h4[id]'))return sibling.id;sibling=sibling.previousElementSibling}return''};
      const anchorFor=(element)=>{const headingId=headingIdFor(element);const type=semanticType(element);const peers=state.candidates.filter((candidate)=>headingIdFor(candidate)===headingId&&semanticType(candidate)===type);return{stable_id:element.id||null,heading_id:headingId||null,type,tag:element.tagName.toLowerCase(),ordinal:peers.indexOf(element),text_hash:hashText(element.innerText),text_start:normalize(element.innerText).slice(0,96)}};
      const resolveAnchor=(anchor)=>{if(anchor.stable_id){const byId=doc().getElementById(anchor.stable_id);if(byId&&state.candidates.includes(byId)&&semanticType(byId)===anchor.type)return byId}const matches=state.candidates.filter((candidate)=>semanticType(candidate)===anchor.type&&headingIdFor(candidate)===(anchor.heading_id||''));const exact=matches.find((candidate)=>hashText(candidate.innerText)===anchor.text_hash);if(exact)return exact;const ordinal=matches[anchor.ordinal];if(ordinal&&normalize(ordinal.innerText).startsWith(normalize(anchor.text_start).slice(0,48)))return ordinal;return null};
      const resolveCue=(cue)=>{const elements=cue.anchors.map(resolveAnchor).filter(Boolean);return elements.length===cue.anchors.length?{...cue,elements,stale:false}:{...cue,elements:[],stale:true}};
      const cueTitle=(elements)=>{const heading=elements.find((element)=>/^H[1-4]$/.test(element.tagName));const words=normalize((heading||elements[0]).innerText).split(' ').filter(Boolean);const title=words.slice(0,7).join(' ');return words.length>7?`${title}…`:title||'Untitled cue'};
      const cuePreview=(cue)=>cue.anchors.map((anchor)=>anchor.text_start).filter(Boolean).join(' · ').slice(0,180);
      const clearStage=()=>{state.staged=false;state.stageShell.classList.remove('visible');state.stageShell.replaceChildren()};
      const clearFocus=()=>{clearStage();state.candidates.forEach((candidate)=>candidate.classList.remove('rl-selected','rl-first-selected'));doc().body.classList.remove('rl-focused');state.selected=[];state.phase='selecting';if(state.mode==='recording')doc().body.classList.add('rl-selecting');updateControls()};
      const boundsFor=(elements)=>{const rects=elements.map((element)=>element.getBoundingClientRect());return{top:Math.min(...rects.map((rect)=>rect.top)),right:Math.max(...rects.map((rect)=>rect.right)),bottom:Math.max(...rects.map((rect)=>rect.bottom)),left:Math.min(...rects.map((rect)=>rect.left))}};
      const scrollSelectionIntoView=(elements)=>{const bounds=boundsFor(elements);if(bounds.top<win().innerHeight*.12||bounds.bottom>win().innerHeight*.86)elements[0].scrollIntoView({behavior:'smooth',block:'center'})};
      const focusElements=(elements,shouldScroll=false)=>{clearStage();state.candidates.forEach((candidate)=>candidate.classList.remove('rl-selected','rl-first-selected'));state.selected=elements;elements.forEach((element)=>element.classList.add('rl-selected'));elements[0]?.classList.add('rl-first-selected');doc().body.classList.remove('rl-selecting');doc().body.classList.add('rl-focused');state.phase='focused';if(shouldScroll)scrollSelectionIntoView(elements);updateControls()};
      const stripCloneIds=(element)=>{element.removeAttribute?.('id');element.querySelectorAll?.('[id]').forEach((child)=>child.removeAttribute('id'));element.querySelectorAll?.('button,[aria-label="Link to this Section"],[aria-label="Link to this Equation"]').forEach((child)=>child.remove())};
      const toggleStage=(force)=>{if(!state.selected.length)return;state.staged=typeof force==='boolean'?force:!state.staged;if(!state.staged){clearStage();updateControls();return}const panel=doc().createElement('div');panel.className='rl-stage-panel';state.selected.forEach((element)=>{const clone=element.cloneNode(true);clone.classList.remove('rl-candidate','rl-selected','rl-first-selected');stripCloneIds(clone);panel.append(clone)});state.stageShell.replaceChildren(panel);state.stageShell.classList.add('visible');updateControls()};

      const draftPayload=()=>({version:2,kind:'recorded-spotlight-draft',slug:state.slug,source_sha256:state.sourceSha,started_at:state.sessionStartedAt,updated_at:new Date().toISOString(),cues:state.cues});
      const saveDraft=()=>{if(state.mode!=='recording'||!state.draftKey)return;try{localStorage.setItem(state.draftKey,JSON.stringify(draftPayload()))}catch{showHint('This browser could not save the draft locally.')}};
      const loadDraft=()=>{try{const raw=localStorage.getItem(state.draftKey);if(!raw)return null;const draft=JSON.parse(raw);return draft?.version===2&&draft?.kind==='recorded-spotlight-draft'&&Array.isArray(draft.cues)?draft:null}catch{return null}};
      const updateControls=()=>{const replay=state.mode==='replay';const focused=state.phase==='focused';action('previous').hidden=!replay;action('next').hidden=!replay;action('previous').disabled=!replay||state.activeIndex<=0;action('next').disabled=!replay||state.activeIndex>=state.replayCues.length-1;action('select').hidden=replay||!focused;action('new').hidden=!replay;action('undo').hidden=replay;action('undo').disabled=!state.cues.length;action('review').hidden=replay;action('review').disabled=!state.cues.length;action('stage').hidden=!state.selected.length;action('stage').textContent=state.staged?'Restore':'Enlarge';action('stage').setAttribute('aria-pressed',String(state.staged));progress.textContent=replay?(state.replayCues.length?`${state.activeIndex+1} / ${state.replayCues.length}`:'No valid cues'):`Recording · ${state.cues.length}`};
      const appendCue=(elements,rectangle)=>{const cue={id:crypto.randomUUID?.()||`cue-${Date.now()}-${state.cues.length}`,title:cueTitle(elements),anchors:elements.map(anchorFor),captured_at:new Date().toISOString(),viewport:{width:win().innerWidth,height:win().innerHeight},rectangle:{x:Number((rectangle.left/win().innerWidth).toFixed(5)),y:Number((rectangle.top/win().innerHeight).toFixed(5)),width:Number((rectangle.width/win().innerWidth).toFixed(5)),height:Number((rectangle.height/win().innerHeight).toFixed(5))}};state.cues.push(cue);saveDraft();focusElements(elements);showHint(`Recorded cue ${state.cues.length}: ${cue.title}`)};
      const intersectionRatio=(a,b)=>{const width=Math.max(0,Math.min(a.right,b.right)-Math.max(a.left,b.left));const height=Math.max(0,Math.min(a.bottom,b.bottom)-Math.max(a.top,b.top));return(width*height)/Math.max(1,a.width*a.height)};
      const centerInside=(candidate,rectangle)=>{const x=candidate.left+candidate.width/2;const y=candidate.top+candidate.height/2;return x>=rectangle.left&&x<=rectangle.right&&y>=rectangle.top&&y<=rectangle.bottom};
      const nearestCandidate=(x,y)=>{let nearest=null;let distance=Infinity;state.candidates.forEach((candidate)=>{const rect=candidate.getBoundingClientRect();const px=clamp(x,rect.left,rect.right);const py=clamp(y,rect.top,rect.bottom);const next=Math.hypot(px-x,py-y);if(next<distance){nearest=candidate;distance=next}});return nearest};
      const selectedByRectangle=(rectangle,releaseX,releaseY)=>{if(rectangle.width<8&&rectangle.height<8)return[nearestCandidate(releaseX,releaseY)].filter(Boolean);const selected=state.candidates.filter((candidate)=>{const rect=candidate.getBoundingClientRect();if(rect.bottom<0||rect.top>win().innerHeight)return false;return centerInside(rect,rectangle)||intersectionRatio(rect,rectangle)>=.2});return selected.length?selected:[nearestCandidate(releaseX,releaseY)].filter(Boolean)};
      const cancelDrag=()=>{state.drag=null;if(state.selectionBox)state.selectionBox.style.display='none'};
      const onPointerDown=(event)=>{if(state.mode!=='recording'||state.phase!=='selecting'||event.button!==0)return;if(event.target.closest('input,textarea,select'))return;event.preventDefault();state.drag={startX:event.clientX,startY:event.clientY,x:event.clientX,y:event.clientY};Object.assign(state.selectionBox.style,{display:'block',left:`${event.clientX}px`,top:`${event.clientY}px`,width:'0px',height:'0px'})};
      const onPointerMove=(event)=>{if(!state.drag)return;event.preventDefault();state.drag.x=event.clientX;state.drag.y=event.clientY;const left=Math.min(state.drag.startX,event.clientX);const top=Math.min(state.drag.startY,event.clientY);Object.assign(state.selectionBox.style,{left:`${left}px`,top:`${top}px`,width:`${Math.abs(event.clientX-state.drag.startX)}px`,height:`${Math.abs(event.clientY-state.drag.startY)}px`})};
      const onPointerUp=(event)=>{if(!state.drag)return;event.preventDefault();const left=Math.min(state.drag.startX,event.clientX);const top=Math.min(state.drag.startY,event.clientY);const right=Math.max(state.drag.startX,event.clientX);const bottom=Math.max(state.drag.startY,event.clientY);const rectangle={left,top,right,bottom,width:right-left,height:bottom-top};const selected=selectedByRectangle(rectangle,event.clientX,event.clientY);cancelDrag();if(selected.length)appendCue(selected,rectangle)};
      const focusReplayIndex=(index)=>{if(!state.replayCues.length)return;state.activeIndex=clamp(index,0,state.replayCues.length-1);focusElements(state.replayCues[state.activeIndex].elements,true)};
      const startRecording=(cues=[])=>{state.mode='recording';state.cues=cues;state.replayCues=[];state.activeIndex=-1;state.sessionStartedAt||=new Date().toISOString();clearFocus();saveDraft();showHint('Drag around content to record a cue · click selects one element')};
      const startReplay=(deck)=>{const resolved=deck.cues.map(resolveCue);const valid=resolved.filter((cue)=>!cue.stale);const staleCount=resolved.length-valid.length;state.mode='replay';state.replayCues=valid;state.cues=[];doc().body.classList.remove('rl-selecting');if(valid.length)focusReplayIndex(0);else clearFocus();if(staleCount)showHint(`${staleCount} stale cue${staleCount===1?'':'s'} skipped; record a new presentation to replace them.`,5000);else showHint('Replaying the frozen presentation · arrows move · Enter enlarges');updateControls()};
      const undoCue=()=>{if(!state.cues.length)return;state.cues.pop();saveDraft();clearFocus();showHint('Removed the last recorded cue.')};
      const moveCue=(from,to)=>{if(from===to||from<0||to<0||from>=state.cues.length||to>=state.cues.length)return;const[cue]=state.cues.splice(from,1);state.cues.splice(to,0,cue);saveDraft();renderReview()};
      const previewCue=(index)=>{const resolved=resolveCue(state.cues[index]);if(resolved.stale){showHint('That cue no longer matches the page.');return}reviewDialog.close();focusElements(resolved.elements,true)};
      const renderReview=()=>{cueList.replaceChildren();state.cues.forEach((cue,index)=>{const item=document.createElement('li');item.className='cue-item';item.draggable=true;item.dataset.index=String(index);const number=document.createElement('span');number.className='cue-number';number.textContent=String(index+1).padStart(2,'0');const copy=document.createElement('button');copy.type='button';copy.className='cue-copy';copy.dataset.cueAction='preview';copy.dataset.index=String(index);const title=document.createElement('strong');title.className='cue-title';title.textContent=cue.title;const preview=document.createElement('span');preview.className='cue-preview';preview.textContent=cuePreview(cue);copy.append(title,preview);const buttons=document.createElement('span');buttons.className='cue-buttons';[['up','↑','Move cue up'],['down','↓','Move cue down'],['delete','×','Delete cue']].forEach(([name,label,aria])=>{const button=document.createElement('button');button.type='button';button.dataset.cueAction=name;button.dataset.index=String(index);button.textContent=label;button.setAttribute('aria-label',aria);if(name==='up')button.disabled=index===0;if(name==='down')button.disabled=index===state.cues.length-1;buttons.append(button)});item.append(number,copy,buttons);cueList.append(item)});if(!state.cues.length){const empty=document.createElement('li');empty.className='empty-cues';empty.textContent='No cues have been recorded yet.';cueList.append(empty)}document.querySelector('[data-review="freeze"]').disabled=!state.cues.length};
      const openReview=()=>{renderReview();reviewDialog.showModal()};
      const frozenDeck=()=>({version:2,kind:'recorded-spotlight-deck',slug:state.slug,source:win().location.pathname,source_sha256:state.sourceSha,recorded_at:new Date().toISOString(),cues:state.cues});
      const freezeAndDownload=()=>{const filename=`${state.slug}-presentation.json`;const blob=new Blob([`${JSON.stringify(frozenDeck(),null,2)}\n`],{type:'application/json'});const link=document.createElement('a');const objectUrl=URL.createObjectURL(blob);link.href=objectUrl;link.download=filename;document.body.append(link);link.click();link.remove();setTimeout(()=>URL.revokeObjectURL(objectUrl),1000);reviewDialog.close();showHint(`Downloaded ${filename} · import it into the textbook when ready.`,5000)};
      const exit=()=>{if(history.length>1)history.back();else location.href=frame.src};
      const onKey=(event)=>{const target=event.target;if(target instanceof win().HTMLElement&&(target.matches('input,textarea,select')||target.isContentEditable))return;if(event.metaKey||event.ctrlKey||event.altKey){if((event.metaKey||event.ctrlKey)&&event.key.toLowerCase()==='z'&&state.mode==='recording'){event.preventDefault();undoCue()}return}if(event.key==='Escape'){if(state.staged){event.preventDefault();toggleStage(false)}else if(state.drag){event.preventDefault();cancelDrag()}else if(state.mode==='recording'&&state.phase==='focused'){event.preventDefault();clearFocus()}}else if(event.key==='Enter'&&state.selected.length){event.preventDefault();toggleStage()}else if(state.mode==='replay'&&(event.key==='ArrowRight'||event.key==='ArrowDown'||event.key===' ')){event.preventDefault();focusReplayIndex(state.activeIndex+1)}else if(state.mode==='replay'&&(event.key==='ArrowLeft'||event.key==='ArrowUp')){event.preventDefault();focusReplayIndex(state.activeIndex-1)}else if(event.key.toLowerCase()==='p'){event.preventDefault();exit()}};
      const fetchSourceSha=async()=>{const pathname=win().location.pathname.replace(/\/$/,'')||'/index';try{const response=await fetch(new URL(`${pathname}.json`,location.origin));if(!response.ok)return'';const metadata=await response.json();return metadata.sha256||''}catch{return''}};
      const chooseInitialMode=()=>{const draft=loadDraft();const deck=deckRegistry[state.slug];if(draft?.cues?.length){document.querySelector('#resume-copy').textContent=`This browser has ${draft.cues.length} unfinished cue${draft.cues.length===1?'':'s'} for this chapter.`;resumeDialog.showModal();return}if(deck?.version===2&&deck?.kind==='recorded-spotlight-deck'&&Array.isArray(deck.cues))startReplay(deck);else startRecording()};
      const initializeFrame=async()=>{const frameDoc=doc();const article=frameDoc.querySelector('article.content');if(!article){loading.textContent='This page has no article content.';return}frameDoc.querySelector('#rl-presenter-style')?.remove();const style=frameDoc.createElement('style');style.id='rl-presenter-style';style.textContent=frameStyles;frameDoc.head.append(style);state.selectionBox=frameDoc.createElement('div');state.selectionBox.className='rl-selection-box';state.stageShell=frameDoc.createElement('div');state.stageShell.className='rl-stage-shell';frameDoc.body.append(state.selectionBox,state.stageShell);state.candidates=buildCandidates(article);state.candidates.forEach((candidate)=>candidate.classList.add('rl-candidate'));state.slug=pageSlug();state.sourceSha=await fetchSourceSha();if(!state.sourceSha)state.sourceSha=hashText(state.candidates.map((candidate)=>candidate.innerText).join('|'));state.draftKey=`rl-presenter:draft:v2:${state.slug}:${state.sourceSha}`;state.sessionStartedAt=new Date().toISOString();frameDoc.addEventListener('pointerdown',onPointerDown,{capture:true});frameDoc.addEventListener('pointermove',onPointerMove,{capture:true});frameDoc.addEventListener('pointerup',onPointerUp,{capture:true});frameDoc.addEventListener('pointercancel',cancelDrag,{capture:true});frameDoc.addEventListener('keydown',onKey);state.stageShell.addEventListener('click',(event)=>{if(event.target===state.stageShell)toggleStage(false)});loading.classList.add('hidden');chooseInitialMode()};

      controls.addEventListener('click',(event)=>{const name=event.target.closest('button')?.dataset.action;if(name==='previous')focusReplayIndex(state.activeIndex-1);if(name==='next')focusReplayIndex(state.activeIndex+1);if(name==='select')clearFocus();if(name==='new')startRecording([]);if(name==='undo')undoCue();if(name==='review')openReview();if(name==='stage')toggleStage();if(name==='exit')exit()});
      resumeDialog.addEventListener('click',(event)=>{const choice=event.target.closest('button')?.dataset.resume;if(!choice)return;const draft=loadDraft();resumeDialog.close();if(choice==='resume'&&draft){state.sessionStartedAt=draft.started_at||state.sessionStartedAt;startRecording(draft.cues)}else{try{localStorage.removeItem(state.draftKey)}catch{}const deck=deckRegistry[state.slug];if(deck?.version===2&&deck?.kind==='recorded-spotlight-deck')startReplay(deck);else startRecording()}});
      reviewDialog.addEventListener('click',(event)=>{const reviewAction=event.target.closest('button')?.dataset.review;if(reviewAction==='close')reviewDialog.close();if(reviewAction==='freeze')freezeAndDownload();const button=event.target.closest('button');const cueAction=button?.dataset.cueAction;const index=Number(button?.dataset.index);if(cueAction==='preview')previewCue(index);if(cueAction==='up')moveCue(index,index-1);if(cueAction==='down')moveCue(index,index+1);if(cueAction==='delete'){state.cues.splice(index,1);saveDraft();renderReview();updateControls()}});
      cueList.addEventListener('dragstart',(event)=>{const item=event.target.closest('.cue-item');if(!item)return;state.draggedCue=Number(item.dataset.index);item.classList.add('dragging');event.dataTransfer.effectAllowed='move'});cueList.addEventListener('dragend',(event)=>{event.target.closest('.cue-item')?.classList.remove('dragging');state.draggedCue=-1});cueList.addEventListener('dragover',(event)=>{if(event.target.closest('.cue-item'))event.preventDefault()});cueList.addEventListener('drop',(event)=>{const target=event.target.closest('.cue-item');if(!target)return;event.preventDefault();moveCue(state.draggedCue,Number(target.dataset.index))});
      document.addEventListener('keydown',onKey);
      frame.addEventListener('load',()=>setTimeout(initializeFrame,700));
      frame.src=sourceUrl();
    })();
  </script>
</body>
</html>
