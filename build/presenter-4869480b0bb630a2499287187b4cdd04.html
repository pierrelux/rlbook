  <title>RL &amp; Control — Presentation Mode</title>
  <style>
    :root {
      color-scheme: light dark;
      --accent: #356ae6;
      --surface: rgba(255, 255, 255, 0.94);
      --border: rgba(15, 23, 42, 0.14);
      --text: #172033;
      --muted: #657087;
      --shadow: 0 18px 55px rgba(15, 23, 42, 0.2);
    }

    * { box-sizing: border-box; }

    html, body {
      width: 100%;
      height: 100%;
      margin: 0;
      overflow: hidden;
      background: #fff;
      color: var(--text);
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    #notes {
      display: block;
      width: 100%;
      height: 100%;
      border: 0;
      background: #fff;
    }

    .controls {
      position: fixed;
      left: 50%;
      bottom: 1rem;
      z-index: 20;
      display: flex;
      align-items: center;
      gap: 0.25rem;
      padding: 0.35rem;
      border: 1px solid var(--border);
      border-radius: 999px;
      background: var(--surface);
      box-shadow: var(--shadow);
      backdrop-filter: blur(18px);
      transform: translateX(-50%);
    }

    button {
      min-width: 2.45rem;
      min-height: 2.45rem;
      padding: 0.55rem 0.75rem;
      border: 0;
      border-radius: 999px;
      color: inherit;
      background: transparent;
      font: 650 0.8rem/1 system-ui, sans-serif;
      cursor: pointer;
    }

    button:hover { background: color-mix(in srgb, var(--accent) 12%, transparent); }
    button:focus-visible { outline: 3px solid color-mix(in srgb, var(--accent) 42%, transparent); outline-offset: 2px; }

    .progress {
      min-width: 5.2rem;
      padding: 0 0.55rem;
      color: var(--muted);
      font-size: 0.76rem;
      font-weight: 650;
      text-align: center;
      white-space: nowrap;
    }

    .hint, .loading {
      position: fixed;
      top: 1rem;
      left: 50%;
      z-index: 20;
      padding: 0.55rem 0.85rem;
      border: 1px solid var(--border);
      border-radius: 999px;
      color: var(--muted);
      background: var(--surface);
      box-shadow: 0 7px 24px rgba(15, 23, 42, 0.12);
      font-size: 0.76rem;
      font-weight: 550;
      pointer-events: none;
      transform: translateX(-50%);
      transition: opacity 180ms ease, translate 180ms ease;
    }

    .hint { opacity: 0; translate: 0 -0.5rem; }
    .hint.visible { opacity: 1; translate: 0 0; }
    .loading.hidden { opacity: 0; }

    @media (prefers-color-scheme: dark) {
      :root {
        --accent: #82a7ff;
        --surface: rgba(28, 25, 23, 0.94);
        --border: rgba(255, 255, 255, 0.16);
        --text: #f5f5f4;
        --muted: #b6b1aa;
        --shadow: 0 18px 55px rgba(0, 0, 0, 0.55);
      }
      html, body, #notes { background: #1c1917; }
    }

    @media (max-width: 650px) {
      .controls button { min-width: 2.2rem; padding-inline: 0.56rem; }
      .progress { min-width: 4.3rem; }
    }
  </style>
</head>
<body>
  <iframe id="notes" title="Course notes in presentation mode"></iframe>
  <div class="loading" role="status">Preparing presentation…</div>
  <div class="hint" role="status"></div>
  <div class="controls" role="toolbar" aria-label="Presentation controls">
    <button type="button" data-action="previous" title="Previous block (←)" aria-label="Previous block">←</button>
    <span class="progress" aria-live="polite">0 / 0</span>
    <button type="button" data-action="next" title="Next block (→ or Space)" aria-label="Next block">→</button>
    <button type="button" data-action="stage" title="Enlarge current block (Enter)" aria-label="Enlarge current block">Enlarge</button>
    <button type="button" data-action="exit" title="Return to the notes (Esc)" aria-label="Return to the notes">Exit</button>
  </div>

  <script>
    (() => {
      const frame = document.querySelector('#notes');
      const progress = document.querySelector('.progress');
      const stageButton = document.querySelector('[data-action="stage"]');
      const hint = document.querySelector('.hint');
      const loading = document.querySelector('.loading');
      const chunkMaps = JSON.parse(document.querySelector('#rl-presentation-chunks').textContent || '{}');
      const state = { beats: [], index: 0, staged: false, scrollFrame: 0, hintTimer: 0, semantic: false };

      const frameStyles = `
        :root { --rl-accent: #356ae6; --rl-surface: rgba(255,255,255,.97); --rl-border: rgba(15,23,42,.14); --rl-shadow: 0 18px 60px rgba(15,23,42,.2); }
        .dark { --rl-accent: #82a7ff; --rl-surface: rgba(28,25,23,.97); --rl-border: rgba(255,255,255,.16); --rl-shadow: 0 18px 60px rgba(0,0,0,.55); }
        html { scroll-behavior: smooth; }
        body { overscroll-behavior-y: contain; }
        .myst-top-nav, .myst-primary-sidebar-topnav, .myst-primary-sidebar-toc, .myst-outline,
        article > .block.my-10.lg\\:sticky,
        article > .myst-fm-block .myst-fm-authors-affiliations,
        article > .myst-fm-block a[href*="github.com"],
        article > .myst-fm-block button { display: none !important; }
        body > main.article-grid, article.article-grid { display: block !important; width: 100% !important; max-width: none !important; }
        article.content { width: min(88vw, 1120px) !important; max-width: none !important; margin: 0 auto !important; padding: 7vh 0 18vh !important; font-size: clamp(1.08rem, 1.45vw, 1.55rem) !important; line-height: 1.58 !important; }
        article > .myst-fm-block { margin-bottom: 8vh !important; padding-top: 0 !important; }
        article > .myst-fm-block h1 { font-size: clamp(2.5rem, 5vw, 5.4rem) !important; line-height: 1.03 !important; letter-spacing: -.035em !important; }
        .rl-beat { position: relative; border-radius: .8rem; cursor: pointer; opacity: .14; filter: blur(.7px); transform: scale(.992); transform-origin: center left; transition: opacity 220ms ease, filter 220ms ease, transform 220ms ease; }
        .rl-beat:hover { opacity: .46; filter: none; }
        .rl-beat.rl-current { z-index: 1; opacity: 1; filter: none; transform: scale(1.018); }
        .rl-beat.rl-current::before { position: absolute; top: .1em; bottom: .1em; left: -1.3rem; width: 4px; border-radius: 999px; background: var(--rl-accent); content: ""; }
        h2.rl-beat, h3.rl-beat, .rl-beat > :is(h2, h3):first-child { margin-top: 2.3em !important; }
        .rl-semantic-beat { position: relative; }
        .rl-beat img, .rl-beat svg, .rl-beat canvas { max-height: 72vh !important; object-fit: contain; }
        body.rl-stage { overflow: hidden; }
        body.rl-stage article.content::after { position: fixed; inset: 0; z-index: 80; background: rgba(15,23,42,.78); content: ""; backdrop-filter: blur(5px); }
        body.rl-stage .rl-beat.rl-current { position: fixed; inset: 6vh 5vw 8vh; z-index: 85; display: flex; flex-direction: column; justify-content: center; width: auto; max-height: 86vh; margin: 0 !important; padding: clamp(1.4rem,4vw,4rem); overflow: auto; border: 1px solid var(--rl-border); border-radius: 1.25rem; color: inherit; background: var(--rl-surface); box-shadow: var(--rl-shadow); cursor: default; transform: none; }
        body.rl-stage .rl-beat.rl-current::before { display: none; }
        @media (prefers-reduced-motion: reduce) { html { scroll-behavior: auto; } .rl-beat { transition: none; } }
      `;

      const sourceUrl = () => {
        const requested = new URLSearchParams(location.search).get('page');
        const fallback = new URL('../dynamics', location.href);
        try {
          const candidate = new URL(requested || document.referrer || fallback, location.href);
          if (candidate.origin !== location.origin || candidate.pathname === location.pathname) return fallback.href;
          return candidate.href;
        } catch {
          return fallback.href;
        }
      };

      const doc = () => frame.contentDocument;
      const win = () => frame.contentWindow;

      const validBeat = (element) => {
        if (!(element instanceof win().HTMLElement)) return false;
        if (element.matches('script, style, link, .hidden, #skip-to-article')) return false;
        if (element.classList.contains('myst-fm-block')) return false;
        if (element.classList.contains('myst-footer-links')) return false;
        if (element.matches('.block.my-10.lg\\:sticky')) return false;
        return Boolean(element.innerText.trim() || element.querySelector('img, svg, canvas, iframe, pre, table'));
      };

      const pageSlug = () => {
        const parts = frame.contentWindow.location.pathname.split('/').filter(Boolean);
        return decodeURIComponent(parts.at(-1) || 'index');
      };

      const semanticBeats = (rawBeats) => {
        const map = chunkMaps[pageSlug()];
        const tags = rawBeats.map((beat) => beat.tagName.toLowerCase());
        const validMap = map
          && map.block_count === rawBeats.length
          && Array.isArray(map.block_tags)
          && map.block_tags.join('|') === tags.join('|')
          && Array.isArray(map.chunks)
          && map.chunks.length;
        if (!validMap) return rawBeats;

        let expected = 0;
        const rangesAreValid = map.chunks.every((chunk) => {
          const valid = Number.isInteger(chunk.start) && Number.isInteger(chunk.end)
            && chunk.start === expected && chunk.end >= chunk.start && chunk.end < rawBeats.length;
          expected = valid ? chunk.end + 1 : expected;
          return valid;
        }) && expected === rawBeats.length && map.chunks[0].end === 0;
        if (!rangesAreValid) return rawBeats;

        state.semantic = true;
        return map.chunks.map((chunk) => {
          const elements = rawBeats.slice(chunk.start, chunk.end + 1);
          if (elements.length === 1) {
            elements[0].dataset.rlChunkTitle = chunk.title;
            return elements[0];
          }
          const wrapper = frame.contentDocument.createElement('div');
          wrapper.className = 'rl-semantic-beat';
          wrapper.dataset.rlChunkTitle = chunk.title;
          elements[0].before(wrapper);
          elements.forEach((element) => wrapper.append(element));
          return wrapper;
        });
      };

      const updateControls = () => {
        progress.textContent = state.beats.length ? `${state.index + 1} / ${state.beats.length}` : 'No content';
        stageButton.textContent = state.staged ? 'Restore' : 'Enlarge';
        stageButton.setAttribute('aria-pressed', String(state.staged));
      };

      const setCurrent = (index, shouldScroll = true) => {
        if (!state.beats.length) return;
        state.index = Math.max(0, Math.min(index, state.beats.length - 1));
        state.beats.forEach((beat, beatIndex) => {
          const current = beatIndex === state.index;
          beat.classList.toggle('rl-current', current);
          beat.setAttribute('aria-current', current ? 'step' : 'false');
        });
        updateControls();
        if (shouldScroll && !state.staged) state.beats[state.index].scrollIntoView({ behavior: 'smooth', block: 'center' });
      };

      const nearestBeat = () => {
        if (state.staged || !state.beats.length) return;
        const center = win().innerHeight * .47;
        let nearest = state.index;
        let distance = Infinity;
        state.beats.forEach((beat, index) => {
          const rect = beat.getBoundingClientRect();
          const point = Math.max(rect.top, Math.min(center, rect.bottom));
          const nextDistance = Math.abs(point - center);
          if (nextDistance < distance) { distance = nextDistance; nearest = index; }
        });
        if (nearest !== state.index) setCurrent(nearest, false);
      };

      const toggleStage = (force) => {
        state.staged = typeof force === 'boolean' ? force : !state.staged;
        doc().body.classList.toggle('rl-stage', state.staged);
        updateControls();
      };

      const showHint = (message) => {
        hint.textContent = message;
        hint.classList.add('visible');
        clearTimeout(state.hintTimer);
        state.hintTimer = setTimeout(() => hint.classList.remove('visible'), 2500);
      };

      const exit = () => {
        if (history.length > 1) history.back();
        else location.href = frame.src;
      };

      const onKey = (event) => {
        const target = event.target;
        if (target instanceof win().HTMLElement && (target.matches('input, textarea, select') || target.isContentEditable)) return;
        if (event.metaKey || event.ctrlKey || event.altKey) return;
        if (event.key === 'Escape') { event.preventDefault(); state.staged ? toggleStage(false) : exit(); }
        else if (event.key === 'Enter') { event.preventDefault(); toggleStage(); }
        else if (event.key === 'ArrowRight' || event.key === 'ArrowDown' || event.key === ' ') { event.preventDefault(); setCurrent(state.index + 1); }
        else if (event.key === 'ArrowLeft' || event.key === 'ArrowUp') { event.preventDefault(); setCurrent(state.index - 1); }
        else if (event.key.toLowerCase() === 'p') { event.preventDefault(); exit(); }
      };

      const initializeFrame = () => {
        const frameDoc = doc();
        const frameArticle = frameDoc.querySelector('article.content');
        if (!frameArticle) {
          loading.textContent = 'This page has no article content.';
          return;
        }

        const style = frameDoc.createElement('style');
        style.id = 'rl-presenter-style';
        style.textContent = frameStyles;
        frameDoc.head.append(style);

        const title = frameArticle.querySelector(':scope > .myst-fm-block h1');
        const content = [...frameArticle.children].filter(validBeat);
        const rawBeats = [title, ...content].filter((beat, index, beats) => beat && beats.indexOf(beat) === index);
        state.semantic = false;
        state.beats = semanticBeats(rawBeats);
        state.beats.forEach((beat) => beat.classList.add('rl-beat'));
        state.index = 0;
        state.staged = false;
        nearestBeat();
        setCurrent(state.index, false);

        frameDoc.addEventListener('keydown', onKey);
        frameDoc.addEventListener('click', (event) => {
          if (state.staged) return;
          const beat = event.target.closest('.rl-beat');
          const index = state.beats.indexOf(beat);
          if (index >= 0) setCurrent(index, false);
        });
        frameDoc.addEventListener('dblclick', (event) => {
          if (state.staged) return;
          const beat = event.target.closest('.rl-beat');
          const index = state.beats.indexOf(beat);
          if (index >= 0) { setCurrent(index, false); toggleStage(true); }
        });
        win().addEventListener('scroll', () => {
          if (state.scrollFrame) return;
          state.scrollFrame = win().requestAnimationFrame(() => { state.scrollFrame = 0; nearestBeat(); });
        }, { passive: true });

        loading.classList.add('hidden');
        showHint(`${state.semantic ? 'Semantic chunks' : 'Fine-grained blocks'} · arrows move · Enter enlarges · Esc exits`);
      };

      document.querySelector('.controls').addEventListener('click', (event) => {
        const action = event.target.closest('button')?.dataset.action;
        if (action === 'previous') setCurrent(state.index - 1);
        if (action === 'next') setCurrent(state.index + 1);
        if (action === 'stage') toggleStage();
        if (action === 'exit') exit();
      });
      document.addEventListener('keydown', onKey);
      // MyST hydrates the server-rendered article just after the iframe load
      // event. Waiting briefly keeps React from replacing our wrappers/styles.
      frame.addEventListener('load', () => setTimeout(initializeFrame, 700));
      frame.src = sourceUrl();
    })();
  </script>
