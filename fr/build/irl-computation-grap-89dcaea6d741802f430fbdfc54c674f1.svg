<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 405" width="900" height="405" role="img"
     aria-label="Computation graphs of behavioral cloning and of Rust's inverse RL estimator">
<style>
  .title { font: 600 11.5px 'IBM Plex Sans', system-ui, -apple-system, 'Segoe UI', sans-serif;
           letter-spacing: .07em; text-transform: uppercase; fill: #5c6874; }
  .node { fill: #ffffff; stroke: #1b2430; stroke-width: 1.6; }
  .data { fill: #eef2f3; stroke: #1b2430; stroke-width: 1.6; }
  .op { fill: #ffffff; stroke: #1b2430; stroke-width: 1.4; }
  .bell { fill: #ffffff; stroke: #2f6f8f; stroke-width: 1.4; }
  .fix { fill: none; stroke: #2f6f8f; stroke-width: 1.1; stroke-dasharray: 2 3; }
  .nlab { font: italic 17px Newsreader, Georgia, 'Times New Roman', serif; fill: #1b2430; }
  .blab { font: italic 15px Newsreader, Georgia, 'Times New Roman', serif; fill: #1b2430; }
  .blab.bl { fill: #2f6f8f; }
  .up { font-style: normal; }
  .lab { font: italic 14px Newsreader, Georgia, 'Times New Roman', serif; fill: #5c6874; }
  .note { font: 12px 'IBM Plex Sans', system-ui, -apple-system, sans-serif; fill: #6e7982; }
  .gnote { font: 12.5px 'IBM Plex Sans', system-ui, -apple-system, sans-serif; fill: #b0543a; }
  .geq { font: italic 14.5px Newsreader, Georgia, 'Times New Roman', serif; fill: #b0543a; }
  .e { fill: none; stroke-width: 1.6; }
  .k { stroke: #1b2430; } .kh { fill: #1b2430; }
  .g { stroke: #b0543a; } .gh { fill: #b0543a; }
  .gd { stroke: #b0543a; stroke-dasharray: 5 4; }
  .rule { stroke: #d5dcdf; stroke-width: 1; }
  .dots { font: 20px Georgia, serif; fill: #2f6f8f; }
  @media (prefers-color-scheme: dark) {
    .title { fill: #a8b2b9; }
    .node, .op { fill: #1b2430; stroke: #edf1f1; }
    .data { fill: #26313d; stroke: #edf1f1; }
    .bell { fill: #1b2430; stroke: #72a8c2; }
    .fix { stroke: #72a8c2; }
    .nlab, .blab { fill: #edf1f1; }
    .blab.bl { fill: #72a8c2; }
    .lab { fill: #a8b2b9; }
    .note { fill: #9ca7ae; }
    .gnote, .geq { fill: #e08a6d; }
    .k { stroke: #edf1f1; } .kh { fill: #edf1f1; }
    .g, .gd { stroke: #e08a6d; } .gh { fill: #e08a6d; }
    .rule { stroke: #3a4652; }
    .dots { fill: #72a8c2; }
  }
</style>
<defs><marker id="h-k" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="kh" d="M0,0.8 L10,5 L0,9.2 z"/></marker><marker id="h-g" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="gh" d="M0,0.8 L10,5 L0,9.2 z"/></marker></defs>
<g>
  <text class="title" x="6" y="24">(a) behavioral cloning</text>
  <path class="e k" d="M69.0,92.0 L128.5,92.0" marker-end="url(#h-k)"/>
  <path class="e k" d="M280.0,92.0 L383.5,92.0" marker-end="url(#h-k)"/>
  <path class="e k" d="M505.0,92.0 L553.5,92.0" marker-end="url(#h-k)"/>
  <path class="e k" d="M809.0,92.0 L726.5,92.0" marker-end="url(#h-k)"/>
  <circle class="data" cx="48.0" cy="92.0" r="21"/><text class="nlab" x="48.0" y="97.0" text-anchor="middle"><tspan dy="0">s</tspan><tspan class="up" font-size="11" dy="4">t</tspan></text>
  <rect class="op" x="130.0" y="71.0" width="150.0" height="42" rx="7"/><text class="blab" x="205.0" y="97.0" text-anchor="middle"><tspan dy="0"></tspan><tspan class="up">network</tspan><tspan dx="4">π</tspan><tspan class="up" font-size="11" dy="4">w</tspan></text>
  <rect class="op" x="385.0" y="71.0" width="120.0" height="42" rx="7"/><text class="blab" x="445.0" y="97.0" text-anchor="middle"><tspan dy="0">π</tspan><tspan class="up" font-size="11" dy="4">w</tspan><tspan dy="-4">(· | s</tspan><tspan class="up" font-size="11" dy="4">t</tspan><tspan dy="-4">)</tspan></text>
  <rect class="op" x="555.0" y="71.0" width="170.0" height="42" rx="7"/><text class="blab" x="640.0" y="97.0" text-anchor="middle"><tspan dy="0"></tspan><tspan class="up">loss</tspan><tspan dx="4">−</tspan><tspan class="up">log</tspan><tspan dx="4">π</tspan><tspan class="up" font-size="11" dy="4">w</tspan><tspan dy="-4">(a</tspan><tspan class="up" font-size="11" dy="4">t</tspan><tspan dy="-4"> | s</tspan><tspan class="up" font-size="11" dy="4">t</tspan><tspan dy="-4">)</tspan></text>
  <circle class="data" cx="830.0" cy="92.0" r="21"/><text class="nlab" x="830.0" y="97.0" text-anchor="middle"><tspan dy="0">a</tspan><tspan class="up" font-size="11" dy="4">t</tspan></text>
  <text class="note" x="205.0" y="62.0" text-anchor="middle">any architecture: MLP, transformer, ...</text>
  <path class="e g" d="M640.0,115.0 L640.0,136.0 L205.0,136.0 L205.0,116.5" marker-end="url(#h-g)"/>
  <text class="gnote" x="422.5" y="153.0" text-anchor="middle">backpropagation through a fixed number of layers</text>
</g>
<line class="rule" x1="0" y1="176" x2="900" y2="176"/>
<g>
  <text class="title" x="6" y="200">(b) inverse RL as in Rust (1987)</text>
  <rect class="fix" x="220.0" y="228.0" width="274.0" height="80" rx="14"/>
  <text class="note" x="357.0" y="220.0" text-anchor="middle">Bellman layers, repeated until v = L v</text>
  <path class="e k" d="M69.0,268.0 L100.5,268.0" marker-end="url(#h-k)"/>
  <path class="e k" d="M198.0,268.0 L231.5,268.0" marker-end="url(#h-k)"/>
  <path class="e k" d="M291.0,268.0 L311.5,268.0" marker-end="url(#h-k)"/>
  <path class="e k" d="M481.0,268.0 L525.5,268.0" marker-end="url(#h-k)"/>
  <path class="e k" d="M569.0,268.0 L596.5,268.0" marker-end="url(#h-k)"/>
  <path class="e k" d="M702.0,268.0 L748.5,268.0" marker-end="url(#h-k)"/>
  <text class="dots" x="397.0" y="274.0" text-anchor="middle">⋯</text>
  <circle class="node" cx="48.0" cy="268.0" r="21"/><text class="nlab" x="48.0" y="273.0" text-anchor="middle"><tspan dy="0">θ</tspan></text>
  <rect class="op" x="102.0" y="247.0" width="96.0" height="42" rx="7"/><text class="blab" x="150.0" y="273.0" text-anchor="middle"><tspan dy="0"></tspan><tspan class="up">reward</tspan><tspan dx="8">r</tspan><tspan class="up" font-size="11" dy="4">θ</tspan></text>
  <rect class="bell" x="233.0" y="247.0" width="58.0" height="42" rx="7"/><text class="blab bl" x="262.0" y="273.0" text-anchor="middle"><tspan dy="0">L</tspan><tspan class="up" font-size="11" dy="4">β,θ</tspan></text>
  <rect class="bell" x="313.0" y="247.0" width="58.0" height="42" rx="7"/><text class="blab bl" x="342.0" y="273.0" text-anchor="middle"><tspan dy="0">L</tspan><tspan class="up" font-size="11" dy="4">β,θ</tspan></text>
  <rect class="bell" x="423.0" y="247.0" width="58.0" height="42" rx="7"/><text class="blab bl" x="452.0" y="273.0" text-anchor="middle"><tspan dy="0">L</tspan><tspan class="up" font-size="11" dy="4">β,θ</tspan></text>
  <circle class="node" cx="548.0" cy="268.0" r="21"/><text class="nlab" x="548.0" y="273.0" text-anchor="middle"><tspan dy="0">v</tspan><tspan class="up" font-size="11" dy="4">θ</tspan></text>
  <rect class="op" x="598.0" y="247.0" width="104.0" height="42" rx="7"/><text class="blab" x="650.0" y="273.0" text-anchor="middle"><tspan dy="0"></tspan><tspan class="up">softmax</tspan><tspan dx="8">π</tspan><tspan class="up" font-size="11" dy="4">θ</tspan></text>
  <rect class="op" x="750.0" y="247.0" width="130.0" height="42" rx="7"/><text class="blab" x="815.0" y="273.0" text-anchor="middle"><tspan dy="0"></tspan><tspan class="up">loss</tspan><tspan>, as in (a)</tspan></text>
  <text class="lab" x="815.0" y="238.0" text-anchor="middle"><tspan dy="0">data  (s</tspan><tspan class="up" font-size="11" dy="4">t</tspan><tspan dy="-4">, a</tspan><tspan class="up" font-size="11" dy="4">t</tspan><tspan dy="-4">)</tspan></text>
  <path class="e gd" d="M548.0,291.0 L548.0,320.0 L150.0,320.0 L150.0,292.5" marker-end="url(#h-g)"/>
  <path class="e gd" d="M262.0,320.0 L262.0,292.0"/>
  <path class="e gd" d="M342.0,320.0 L342.0,292.0"/>
  <path class="e gd" d="M452.0,320.0 L452.0,292.0"/>
  <text class="gnote" x="562.0" y="325.0">unrolled: backpropagate through all K layers;</text>
  <text class="gnote" x="562.0" y="341.0">memory and truncation error grow with depth</text>
  <path class="e g" d="M540.0,289.0 C508.0,390.0 78.0,390.0 54.0,292.0" marker-end="url(#h-g)"/>
  <text class="gnote" x="562.0" y="364.0">implicit: one linear solve, valid at the fixed point only</text>
  <text class="geq" x="562.0" y="388.0"><tspan dy="0">∂v</tspan><tspan class="up" font-size="11" dy="4">θ</tspan><tspan dy="-4">/∂θ = (I − γP</tspan><tspan class="up" font-size="11" dy="4">π</tspan><tspan dy="-4">)</tspan><tspan class="up" font-size="11" dy="-6">−1</tspan><tspan dy="6"> ∂r</tspan><tspan class="up" font-size="11" dy="4">π</tspan><tspan dy="-4">/∂θ</tspan></text>
</g>
</svg>
