    root.dataset.theme = dark ? "dark" : "light";

  if (hasPolicies) {
    sceneView.setAttribute("hidden", "");
    policyView.removeAttribute("hidden");
    ageField.hidden = false;
    updateAgeOptions();

  renderFrame(false);
  const fallbackIds = {
    modeling: "fig-inference-serving-model-fallback",
    open_loop: "fig-inference-open-loop-fallback",
    mpc: "fig-inference-mpc-fallback",
    scheduling: "fig-inference-scheduling-dp-fallback",
    fqi: "fig-inference-scheduling-fqi-fallback"

  const fallbackId = fallbackIds[replay.view];
  let fallbackDocument = document;
  try {
    if (window.parent && window.parent !== window && window.parent.document) {
      fallbackDocument = window.parent.document;
    }
  } catch (error) { /* Cross-origin embedding keeps the local document. */ }
  const hideFallback = () => {
    if (!fallbackId) return true;
    const fallback = fallbackDocument.getElementById(fallbackId);
    if (!fallback) return false;
    fallback.hidden = true;
    fallback.setAttribute("aria-hidden", "true");
    return true;
  };

    const fallbackObserver = new MutationObserver(() => {
      if (hideFallback()) fallbackObserver.disconnect();
    });
    fallbackObserver.observe(fallbackDocument.documentElement, {childList: true, subtree: true});
