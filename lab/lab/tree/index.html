<!DOCTYPE html>
<html>
  <head>
    <script>
      // redirect to /lab by default
      (function () {
        window.location.href = window.location.href.replace(
          /(\/tree\/(index\.html)?)/,
          '/index.html'
        );
      }.call(this));
    </script>
  <script>(function(){var p=window.location.pathname;if(p.endsWith('/index.html'))window.location.replace((p.slice(0,-10)||'/')+window.location.search+window.location.hash);})();</script></head>
</html>
