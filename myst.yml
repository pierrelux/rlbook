# See docs at: https://mystmd.org/guide/frontmatter
version: 1
project:
  id: 3c112bb5-93ac-429f-8216-c0b9947c00d4
  title: "Building Up RL: From Dynamics and Control to Learning"
  description: "A graduate-level introduction to reinforcement learning as a framework for modeling, optimization, and control, connecting dynamic models, data, and applications beyond standard benchmarks."
  authors:
    - name: Pierre-Luc Bacon
  github: https://github.com/pierrelux/rlbook
  bibliography:
    - references.bib
  exclude:
    # Generated copies are build inputs/outputs, not authored pages. A file
    # listed in the toc, such as the collocation notebook under lab/, is still
    # built as a page.
    - .jupyter-book-marimo/**
    - .venv/**
    - _build/**
    - exports/**
    - lab/**
    # French chapters are built separately by tools/french.py.
    - fr/**
  static_files:
    - interactive
  plugins:
    - type: executable
      path: .venv/bin/jupyter-book-marimo
    - plugins/pdf-static-parity.mjs
  math:
    '\Proj': '\mathsf{P}'
    '\Residual': '\mathsf{N}'
    '\Contraction': '\mathsf{T}'
    '\Bellman': '\mathsf{L}'
    '\BellmanPi': '\mathsf{L}_\pi'
    '\BellmanQuad': '\widetilde{\mathsf{L}}'
    '\EulerResidual': '\mathsf{H}'
    '\Policy': '\pi'
  exports:
    - format: pdf
      template: templates/rlbook-pdf
      output: exports/book.pdf
  toc:
    - file: intro.md
    - file: syllabus.md
    - title: Modeling Sequential Decisions
      children:
        - file: modeling-controlled-systems.md
        - file: stochastic-dynamics-observation.md
        - file: model-interfaces.md
    - title: Trajectory Optimization
      children:
        - file: discrete-time-optimal-control.md
        - file: discrete-time-pmp.md
        - file: numerical-trajectory-optimization.md
        - file: continuous-time-collocation.md
        - file: model-predictive-path-integral-control.md
    - title: Model Predictive Control
      children:
        - file: receding-horizon-control.md
        - file: mpc-variants-reliability.md
        - file: parametric-controllers.md
    - title: Dynamic Programming
      children:
        - file: finite-horizon-dp.md
          children:
            - file: iterative-trajectory-optimization.md
        - file: stochastic-dp.md
        - file: infinite-horizon-mdps.md
        - file: regularized-dp.md
          children:
            - file: path-integral-stochastic-control.md
        - title: Approximate Dynamic Programming
          children:
            - file: weighted-residual-methods.md
            - file: approximate-bellman-equations.md
            - file: monte-carlo-bellman-estimation.md
            - file: fitted-q-iteration.md
    - title: Policy Optimization
      children:
        - file: amortized-action-optimization.md
        - file: gradient-estimation.md
        - file: regularized-policy-learning.md
        - file: policy-gradients.md
    - title: Demos
      children:
        - file: lab/notebooks/08_collocation_from_nodes.ipynb
    - title: Appendix
      children:
        - file: appendix_examples.md
        - file: appendix_ivps.md
        - file: appendix_nlp.md
    
site:
  template: book-theme
  options:
    logo_text: "RL & Control"
    logo: _static/logo.svg
    logo_dark: _static/logo-dark.svg
    logo_alt: "A trajectory spiralling into a fixed point"
    favicon: _static/logo.svg
    numbered: true
    outline_maxdepth: 1
    style: _static/custom.css
  actions:
    - title: Français
      url: _static/francais.html
    - title: View on GitHub
      url: https://github.com/pierrelux/rlbook
